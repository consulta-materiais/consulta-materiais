<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pesquisa de Materiais</title>

  <style>
    :root {
      --bordo: #9d1635
;
      --bordo-escuro: #7f102a
;
      --azul-escuro: #142b45
;
      --fundo: #f3f5f7
;
      --borda: #dfe3e8
;
      --texto: #27313d
;
      --cinza: #66717d
;
      --branco: #ffffff
;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .cabecalho {
      text-align: center;
      margin-bottom: 18px;
    }

    .cabecalho h1 {
      margin: 0;
      color: var(--bordo);
      font-size: clamp(1.45rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cabecalho p {
      margin: 7px 0 0;
      color: var(--azul-escuro);
      font-size: 0.9rem;
    }

    .navegacao {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .botao-nav {
      border: 0;
      border-radius: 5px;
      padding: 9px 16px;
      color: var(--branco);
      background: var(--azul-escuro);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .botao-nav.ativo,
    .botao-principal {
      background: var(--bordo);
    }

    .botao-nav:hover,
    .botao-principal:hover {
      background: var(--bordo-escuro);
    }

    .painel {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: clamp(18px, 4vw, 32px);
      box-shadow: 0 3px 14px rgba(20, 43, 69, 0.08);
    }

    .titulo-secao {
      margin: 0;
      color: var(--bordo);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .descricao-secao {
      margin: 7px 0 22px;
      color: var(--cinza);
      font-size: 0.86rem;
    }

    .formulario-busca {
      display: flex;
      gap: 10px;
      align-items: end;
      margin-bottom: 20px;
    }

    .campo {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--azul-escuro);
      font-size: 0.75rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border: 1px solid #cbd2d9
;
      border-radius: 4px;
      outline: none;
      color: var(--texto);
      background: #fff;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--bordo);
      box-shadow: 0 0 0 3px rgba(157, 22, 53, 0.12);
    }

    button {
      font-family: inherit;
    }

    .botao-principal {
      min-height: 44px;
      padding: 0 19px;
      border: 0;
      border-radius: 4px;
      color: var(--branco);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .barra-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 0 12px;
      color: var(--azul-escuro);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .lista {
      display: grid;
      gap: 10px;
    }

    .material {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--borda);
      border-left: 4px solid var(--bordo);
      border-radius: 5px;
      background: #fcfcfd
;
    }

    .codigo {
      margin-bottom: 5px;
      color: var(--bordo);
      font-size: 0.96rem;
      font-weight: 800;
    }

    .descricao-material {
      color: var(--texto);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .botao-copiar {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--azul-escuro);
      border-radius: 4px;
      color: var(--azul-escuro);
      background: transparent;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .botao-copiar:hover {
      color: var(--branco);
      background: var(--azul-escuro);
    }

    .mensagem-vazia {
      padding: 28px 15px;
      border: 1px dashed #cbd2d9
;
      border-radius: 5px;
      color: var(--cinza);
      text-align: center;
      font-size: 0.9rem;
    }

    .notificacao {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 11px 15px;
      border-radius: 5px;
      color: #fff;
      background: var(--azul-escuro);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.18);
      font-size: 0.84rem;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.25s ease;
    }

    .notificacao.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 560px) {
      body {
        padding: 16px 10px;
      }

      .formulario-busca {
        display: block;
      }

      .botao-principal {
        width: 100%;
        margin-top: 10px;
      }

      .material {
        align-items: flex-start;
        flex-direction: column;
      }

      .botao-copiar {
        width: 100%;
      }

      .barra-resultados {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="cabecalho">
      <h1>Pesquisa de Materiais</h1>
      <p>Consulte códigos e descrições de materiais</p>

  </main>

const materiais = dados
  .trim()
  .split('\n')
  .map(linha => {
    const [codigo, descricao] = linha.split('|');

    return {
      codigo: codigo.trim(),
      descricao: descricao.trim()
    };
  });

    const campoBusca = document.getElementById("campoBusca");
    const listaMateriais = document.getElementById("listaMateriais");
    const contador = document.getElementById("contador");
    const formularioBusca = document.getElementById("formularioBusca");
    const limparBusca = document.getElementById("limparBusca");
    const notificacao = document.getElementById("notificacao");

    function normalizar(texto) {
      return String(texto)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function mostrarMateriais() {
      const termo = normalizar(campoBusca.value);

      const resultados = materiais.filter((material) => {
        const codigo = normalizar(material.codigo);
        const descricao = normalizar(material.descricao);

        return codigo.includes(termo) || descricao.includes(termo);
      });

      contador.textContent =
        resultados.length === 1
          ? "1 material encontrado"
          : `${resultados.length} materiais encontrados`;

      if (resultados.length === 0) {
        listaMateriais.innerHTML = `
          <div class="mensagem-vazia">
            Nenhum material encontrado para esta pesquisa.
          </div>
        `;
        return;
      }

      listaMateriais.innerHTML = resultados
        .map(
          (material) => `
            <article class="material">
              <div>
                <div class="codigo">${escaparHTML(material.codigo)}</div>
                <div class="descricao-material">
                  ${escaparHTML(material.descricao)}
                </div>
              </div>

              <button
                class="botao-copiar"
                type="button"
                onclick="copiarCodigo('${escaparHTML(material.codigo)}')"
              >
                COPIAR CÓDIGO
              </button>
            </article>
          `
        )
        .join("");
    }

    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function copiarCodigo(codigo) {
      try {
        await navigator.clipboard.writeText(codigo);
        mostrarNotificacao("Código copiado");
      } catch {
        mostrarNotificacao("Não foi possível copiar o código");
      }
    }

    function mostrarNotificacao(texto) {
      notificacao.textContent = texto;
      notificacao.classList.add("visivel");

      setTimeout(() => {
        notificacao.classList.remove("visivel");
      }, 1800);
    }

    campoBusca.addEventListener("input", mostrarMateriais);

    formularioBusca.addEventListener("submit", (evento) => {
      evento.preventDefault();
      mostrarMateriais();
    });

    limparBusca.addEventListener("click", () => {
      campoBusca.value = "";
      mostrarMateriais();
      campoBusca.focus();
    });

    mostrarMateriais();
  </script>
